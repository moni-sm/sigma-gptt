name: Continuous Deployment (CD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 Production
    runs-on: ubuntu-latest

    steps:
      - name: Validate Deployment Secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ ERROR: EC2_SSH_KEY secret is not set in your GitHub repository!"
            echo "👉 Please go to GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "👉 Add a new secret named 'EC2_SSH_KEY' with the contents of your sigma-gpt.pem private key."
            exit 1
          fi
          echo "✅ SSH Key secret detected."

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || 'moni-sigmagpt.duckdns.org' }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Automated Deployment on EC2..."
            
            # Navigate to project directory
            APP_DIR="/home/${{ secrets.EC2_USER }}/sigma-gptt"
            if [ ! -d "$APP_DIR" ]; then
              APP_DIR="/home/ec2-user/sigma-gptt"
            fi
            cd "$APP_DIR"
            
            # Pull latest changes from main branch
            echo "📥 Fetching and syncing latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            
            # Deploy Backend
            echo "⚙️ Setting up Backend dependencies & restarting PM2..."
            cd Backend
            npm ci --omit=dev || npm install --omit=dev
            pm2 reload sigmagpt-backend || pm2 start server.js --name "sigmagpt-backend"
            pm2 save
            
            # Deploy Frontend
            echo "🎨 Installing Frontend dependencies & building production bundle..."
            cd ../Frontend
            npm ci
            npm run build
            
            # Update Nginx config if present
            echo "🌐 Validating and reloading Nginx..."
            cd ..
            if [ -f "nginx.conf" ]; then
              sudo cp nginx.conf /etc/nginx/nginx.conf
              sudo nginx -t && sudo systemctl reload nginx
            fi
            
            # Verification
            echo "🩺 Running local health check..."
            sleep 2
            curl -s -f http://127.0.0.1:8080/api/health || true
            
            echo "🎉 Deployment successfully completed!"
