name: Continuous Deployment (CD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 Production
    runs-on: ubuntu-latest

    steps:
      - name: Validate Deployment Secrets
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: EC2_SSH_KEY secret is not set in your GitHub repository!"
            echo "👉 Please go to GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "👉 Add a new secret named 'EC2_SSH_KEY' with the contents of your sigma-gpt.pem private key."
            exit 1
          fi
          echo "✅ SSH Key secret detected."

      - name: Deploy to AWS EC2 via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST || 'moni-sigmagpt.duckdns.org' }}
          USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          # Configure SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Clean and normalize key
          RAW_KEY=$(printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          
          if echo "$RAW_KEY" | grep -q "OPENSSH PRIVATE KEY"; then
            HEADER="-----BEGIN OPENSSH PRIVATE KEY-----"
            FOOTER="-----END OPENSSH PRIVATE KEY-----"
            BODY=$(echo "$RAW_KEY" | sed 's/-----BEGIN OPENSSH PRIVATE KEY-----//g' | sed 's/-----END OPENSSH PRIVATE KEY-----//g' | tr -s ' ' '\n' | grep -v '^[[:space:]]*$')
            printf "%s\n%s\n%s\n" "$HEADER" "$BODY" "$FOOTER" > ~/.ssh/ec2_key
          elif echo "$RAW_KEY" | grep -q "RSA PRIVATE KEY"; then
            HEADER="-----BEGIN RSA PRIVATE KEY-----"
            FOOTER="-----END RSA PRIVATE KEY-----"
            BODY=$(echo "$RAW_KEY" | sed 's/-----BEGIN RSA PRIVATE KEY-----//g' | sed 's/-----END RSA PRIVATE KEY-----//g' | tr -s ' ' '\n' | grep -v '^[[:space:]]*$')
            printf "%s\n%s\n%s\n" "$HEADER" "$BODY" "$FOOTER" > ~/.ssh/ec2_key
          else
            printf "%s\n" "$RAW_KEY" > ~/.ssh/ec2_key
          fi

          chmod 600 ~/.ssh/ec2_key
          
          echo "🔑 Verifying SSH key structure..."
          ssh-keygen -l -f ~/.ssh/ec2_key || {
            echo "❌ Invalid SSH key format detected. Please verify EC2_SSH_KEY secret."
            exit 1
          }

          # Scan host key to prevent MITM prompt
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Connect and execute deployment
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new -p "$PORT" "$USER@$HOST" << 'EOF'
            set -e
            echo "🚀 Starting Automated Deployment on EC2..."

            # Navigate to project directory
            APP_DIR="/home/$(whoami)/sigma-gptt"
            if [ ! -d "$APP_DIR" ]; then
              APP_DIR="/home/ec2-user/sigma-gptt"
            fi
            cd "$APP_DIR"

            # Pull latest changes from main branch
            echo "📥 Fetching and syncing latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Deploy Backend
            echo "⚙️ Setting up Backend dependencies & restarting PM2..."
            cd Backend
            npm ci --omit=dev || npm install --omit=dev
            pm2 reload sigmagpt-backend || pm2 start server.js --name "sigmagpt-backend"
            pm2 save

            # Deploy Frontend
            echo "🎨 Installing Frontend dependencies & building production bundle..."
            cd ../Frontend
            npm ci
            npm run build

            # Update Nginx config if present
            echo "🌐 Validating and reloading Nginx..."
            cd ..
            if [ -f "nginx.conf" ]; then
              sudo cp nginx.conf /etc/nginx/nginx.conf
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # Verification
            echo "🩺 Running local health check..."
            sleep 2
            curl -s -f http://127.0.0.1:8080/api/health || true

            echo "🎉 Deployment successfully completed!"
          EOF

